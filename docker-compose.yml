services:
  dbhub-server:
    build: ./server
    container_name: dbhub-server
    restart: unless-stopped
    volumes:
      - dbhub-data:/app/data
    environment:
      - PORT=3002
    # No public port — nginx proxies to it internally

  dbhub:
    build: .
    container_name: dbhub-admin
    ports:
      - "8090:80"
    restart: unless-stopped
    depends_on:
      - dbhub-server
    environment:
      - VITE_API_MODE=local
      - VITE_LOCAL_API_URL=/api

volumes:
  dbhub-data:
